version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: union_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-registro_muni_union}
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde el host, no expuesto a la red
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-registro_muni_union}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./back
    container_name: union_api
    restart: always
    expose:
      - "4000"                   # solo visible internamente (nginx hace de proxy)
    environment:
      NODE_ENV: production
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-registro_muni_union}
      DB_PORT: 5432
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./back/uploads:/app/uploads

  frontend:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: union_web
    restart: always
    expose:
      - "3000"                   # solo visible internamente (nginx hace de proxy)
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: union_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Dominio/IP público (portal de verificación — acceso desde internet)
      PUBLIC_DOMAIN:   ${PUBLIC_DOMAIN:-verificar.muniunion.gob.pe}
      # Dominio/IP interno (sistema completo — solo red LAN)
      INTERNAL_DOMAIN: ${INTERNAL_DOMAIN:-192.168.1.100}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/public:/etc/nginx/ssl/public:ro    # cert público (Let's Encrypt o autofirmado)
      - ./nginx/ssl/internal:/etc/nginx/ssl/internal:ro # cert interno (autofirmado CA interna)
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
