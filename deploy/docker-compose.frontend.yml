version: '3.8'
# ─────────────────────────────────────────────────────────────────
# docker-compose para VM FRONTEND — 172.16.3.21
# Solo corre Next.js. Nginx corre fuera de Docker en el host.
# Usar: docker compose -f deploy/docker-compose.frontend.yml up -d --build
# ─────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: union_web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"  # Solo Nginx (host) puede accederlo
    env_file:
      - .env.frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
