version: '3.8'
# ─────────────────────────────────────────────────────────────────
# docker-compose para VM BACKEND — 172.16.3.22
# Solo corre la API de Express. No incluye DB ni Nginx.
# Usar: docker compose -f deploy/docker-compose.backend.yml up -d --build
# ─────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ../back
      dockerfile: Dockerfile
    container_name: union_api
    restart: always
    ports:
      - "172.16.3.22:4000:4000"   # Solo escucha en la IP de esta VM
    env_file:
      - .env.backend
    volumes:
      - /mnt/uploads:/app/uploads  # Carpeta NFS desde VM Storage (.24)
      - /mnt/logs:/app/logs        # Logs centralizados en VM Storage (.24)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
