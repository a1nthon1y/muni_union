worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Ocultar versión de nginx
    server_tokens off;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Límite de body (documentos digitalizados hasta 25 MB)
    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Redirigir todo HTTP → HTTPS ─────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Servidor principal HTTPS ─────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;                 # reemplazar con el hostname/IP real

        # Certificados SSL
        # Opciones:
        #   A) Certificado autofirmado (para red interna): ver README-produccion.md
        #   B) Let's Encrypt (si el servidor tiene dominio público)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # ── Frontend (Next.js) ───────────────────────────────────
        location / {
            proxy_pass         http://union_web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Backend API ──────────────────────────────────────────
        location /api/ {
            proxy_pass         http://union_api:4000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts para uploads grandes
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Archivos subidos (documentos digitalizados) ──────────
        location /uploads/ {
            proxy_pass http://union_api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
