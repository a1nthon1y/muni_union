worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    client_max_body_size 25M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Proxy headers comunes (reutilizados en ambos servers) ──────
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # ══════════════════════════════════════════════════════════════
    # BLOQUE 1 — PORTAL PÚBLICO DE VERIFICACIÓN
    # Accesible desde internet, solo expone /verificar y /api/verificar
    # Configurar: PUBLIC_IP o dominio público (ej. verificar.muniunion.gob.pe)
    # Certificado: Let's Encrypt (si hay dominio) o autofirmado
    # ══════════════════════════════════════════════════════════════

    server {
        listen 80;
        server_name ${PUBLIC_DOMAIN};        # ej: verificar.muniunion.gob.pe
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ${PUBLIC_DOMAIN};        # ej: verificar.muniunion.gob.pe

        ssl_certificate     /etc/nginx/ssl/public/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/public/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL_PUB:5m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # ── Solo se permiten estas rutas ─────────────────────────

        # Página de verificación (Next.js)
        location ~ ^/verificar(/.*)?$ {
            proxy_pass       http://union_web:3000;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # Assets de Next.js necesarios para que la página cargue
        location ~ ^/_next/ {
            proxy_pass http://union_web:3000;
        }

        # Favicon / logo
        location ~ ^/(favicon\.ico|Logo_MDUnion\.svg)$ {
            proxy_pass http://union_web:3000;
        }

        # Endpoint público de la API de verificación
        location ~ ^/api/verificar/ {
            proxy_pass http://union_api:4000;

            proxy_connect_timeout 15s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }

        # ── Todo lo demás: bloqueado ──────────────────────────────
        location / {
            return 403 '{"error":"Acceso no autorizado"}';
            add_header Content-Type application/json;
        }
    }

    # ══════════════════════════════════════════════════════════════
    # BLOQUE 2 — SISTEMA INTERNO (red LAN de la municipalidad)
    # Solo accesible desde la red interna / VPN
    # Configurar: IP interna o hostname LAN (ej. 192.168.1.100)
    # Certificado: autofirmado o CA interna
    # ══════════════════════════════════════════════════════════════

    server {
        listen 80;
        server_name ${INTERNAL_DOMAIN};      # ej: 192.168.1.100 o sistema.muni.local
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ${INTERNAL_DOMAIN};      # ej: 192.168.1.100 o sistema.muni.local

        ssl_certificate     /etc/nginx/ssl/internal/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/internal/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL_INT:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # ── Frontend completo (Next.js) ──────────────────────────
        location / {
            proxy_pass         http://union_web:3000;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # ── Backend API completo ─────────────────────────────────
        location /api/ {
            proxy_pass http://union_api:4000;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Archivos digitalizados ───────────────────────────────
        location /uploads/ {
            proxy_pass http://union_api:4000;
        }
    }
}
